const CHUSEOK_START = "2026-09-24";

function isChuseokPeriod(){

  const now =
    new Date();

  const today =
    now.getFullYear()
    + "-"
    + String(
        now.getMonth()+1
      ).padStart(2,"0")
    + "-"
    + String(
        now.getDate()
      ).padStart(2,"0");

  return (
    today >= CHUSEOK_START &&
    today <= CHUSEOK_END
  );
}


function applyChuseokTheme(){

  if(isChuseokPeriod()){

    document.body.classList.add(
      "chuseok-theme"
    );

  }else{

    document.body.classList.remove(
      "chuseok-theme"
    );

  }

}

function parseDate(v){

  if(!v) return null;

  const [y,m,d] =
    v.split('-').map(Number);

  return new Date(y, m-1, d);
}


function pad2(n){
  return String(n).padStart(2,'0');
}


function isoLocal(d){

  return d.getFullYear()
    + "-"
    + pad2(d.getMonth()+1)
    + "-"
    + pad2(d.getDate());
}


function getDowKor(d){

  const days =
    ["일","월","화","수","목","금","토"];

  return days[d.getDay()];
}


function updateDowLabel(){

  const d =
    parseDate(
      document.getElementById("dayDate").value
    );

  const el =
    document.getElementById("dowLabel");

  el.textContent =
    d ? `(${getDowKor(d)})` : "";

const MY_NAME_KEY = "t2b_my_name";


function getMyName(){

  return (
    localStorage.getItem(MY_NAME_KEY) || ""
  ).trim();
}


function setMyName(v){

  const name =
    (v || "").trim();

  if(!name){

    localStorage.removeItem(
      MY_NAME_KEY
    );

  }else{

    localStorage.setItem(
      MY_NAME_KEY,
      name
    );

  }
}

function populateMyNameSelect(){

  const select =
    document.getElementById(
      "myNameSelect"

  if(!select) return;


  const picked =
    parseDate(
      document.getElementById("dayDate").value
    ) || new Date();


  const iso =
    isoLocal(picked);

  const data =
    pickData(iso);


  const names =
    [...data.workers]
      .sort((a,b)=>
        a.localeCompare(b,"ko")
      );


  select.innerHTML =
    `<option value="">(선택 안 함)</option>`
    +
    names.map(n =>
      `<option value="${n}">${n}</option>`
    ).join("");


  const saved =
    getMyName();


  if(saved){

    const opt =
      [...select.options]
        .find(o=>o.value === saved);

    if(opt)
      select.value = saved;

  }else{

    select.value = "";

  }

/* =========================
   근무/휴무
========================= */

function isWork(d){

  if(!d)
    return false;

  if(d < START)
    return false;

  if(d.getDay() === 0)
    return false;

  return !HOLIDAYS.includes(
    isoLocal(d)
  );
}


function isRoundOff(
  dateIso,
  roundNum
){

  const arr =
    ROUND_OFF[dateIso];

  return !!(
    arr &&
    arr.includes(roundNum)
  );
}


/* =========================
   누적 라운드 계산
========================= */

function roundsDoneBeforeDate(
  data,
  targetDate
){

  const targetIso =
    isoLocal(targetDate);

  const baseD =
    parseDate(data.baseDate);

  if(!baseD)
    return 0;


  const forward =
    targetDate >= baseD;

  let sum = 0;


  if(forward){

    let d =
      new Date(baseD.getTime());


    while(
      isoLocal(d) < targetIso
    ){

      if(isWork(d)){

        const iso =
          isoLocal(d);

        let offCnt = 0;


        for(
          let r=1;
          r<=4;
          r++
        ){

          if(
            isRoundOff(iso,r)
          )
            offCnt++;

        }


        sum +=
          (4-offCnt);
      }


      d.setDate(
        d.getDate()+1
      );

    }


    return sum;

  }else{

    let d =
      new Date(
        targetDate.getTime()
      );


    while(
      isoLocal(d) <
      isoLocal(baseD)
    ){

      if(isWork(d)){

        const iso =
          isoLocal(d);

        let offCnt = 0;


        for(
          let r=1;
          r<=4;
          r++
        ){

          if(
            isRoundOff(iso,r)
          )
            offCnt++;

        }


        sum +=
          (4-offCnt);
      }


      d.setDate(
        d.getDate()+1
      );

    }


    return -sum;

  }
}


function performedIndexInDay(
  dateIso,
  roundNum
){

  if(
    isRoundOff(
      dateIso,
      roundNum
    )
  )
    return null;


  let idx = 0;


  for(
    let r=1;
    r<roundNum;
    r++
  ){

    if(
      !isRoundOff(
        dateIso,
        r
      )
    )
      idx++;

  }


  return idx;
}


/* =========================
   스케줄 계산
========================= */

function getScheduleForDate(
  targetDate
){

  if(!isWork(targetDate))
    return null;


  const dateIso =
    isoLocal(targetDate);

  const data =
    pickData(dateIso);


  const workers =
    data.workers;

  const tasks =
    data.tasks;


  const baseTaskIdx =
    tasks.indexOf(
      data.baseTask
    );


  const basePersonIdx =
    workers.indexOf(
      data.basePerson
    );


  if(
    baseTaskIdx < 0 ||
    basePersonIdx < 0
  )
    return null;


  const offsetRounds =
    roundsDoneBeforeDate(
      data,
      targetDate
    );


  return workers.map(
    (name, personIdx)=>{

      const personDelta =
        personIdx -
        basePersonIdx;

      const rounds = [];


      for(
        let roundNum=1;
        roundNum<=4;
        roundNum++
      ){

        const pi =
          performedIndexInDay(
            dateIso,
            roundNum
          );


        if(pi === null){

          rounds.push("휴무");

          continue;
        }


        const taskIdx =
          (
            baseTaskIdx +
            offsetRounds +
            personDelta +
            pi
          )
          % tasks.length;


        rounds.push(
          tasks[
            (
              taskIdx +
              tasks.length
            )
            % tasks.length
          ]
        );

      }


      return {
        name,
        rounds
      };

    }
  );
}


/* =========================
   화면 출력
========================= */

function renderDay(){

  updateDowLabel();

  populateMyNameSelect();


  const d =
    parseDate(
      document.getElementById(
        "dayDate"
      ).value
    );


  const dayBody =
    document.getElementById(
      "dayBody"
    );


  const dayWarn =
    document.getElementById(
      "dayWarn"
    );


  dayBody.innerHTML = "";


  if(
    !d ||
    !isWork(d)
  ){

    dayWarn.textContent =
      "휴무일입니다.";

    return;
  }


  const s =
    getScheduleForDate(d);


  if(!s){

    dayWarn.textContent =
      "스케줄 계산에 문제가 있어요. (기준/명단/작업 순서 확인 필요)";

    return;
  }


  dayWarn.textContent = "";


  /* 1R LH B필라 담당자 기준 정렬 */

  const data =
    pickData(
      isoLocal(d)
    );

  const order =
    data.workers;


  const lhBPillarPerson =
    s.find(
      r => r.rounds[0] === "LH B필라"
    );


  if(lhBPillarPerson){

    const startIdx =
      order.indexOf(
        lhBPillarPerson.name
      );


    if(startIdx >= 0){

      const rotated = [

        ...order.slice(
          startIdx
        ),

        ...order.slice(
          0,
          startIdx
        )

      ];


      s.sort(
        (a,b)=>{

          return (
            rotated.indexOf(a.name) -
            rotated.indexOf(b.name)
          );

        }
      );

    }

  }


  const myName =
    getMyName();


  s.forEach(r=>{

    const c1 =
      (r.rounds[0] === "휴무")
      ? "off"
      : "round-1";


    const c2 =
      (r.rounds[1] === "휴무")
      ? "off"
      : "round-2";


    const c3 =
      (r.rounds[2] === "휴무")
      ? "off"
      : "round-3";


    const c4 =
      (r.rounds[3] === "휴무")
      ? "off"
      : "round-4";


    const isMine =
      myName &&
      (r.name === myName);


    dayBody.innerHTML += `

      <tr class="${isMine ? "my-row" : ""}">

        <td class="name-col">
          ${r.name}
        </td>

        <td class="${c1}">
          ${r.rounds[0]}
        </td>

        <td class="${c2}">
          ${r.rounds[1]}
        </td>

        <td class="${c3}">
          ${r.rounds[2]}
        </td>

        <td class="${c4}">
          ${r.rounds[3]}
        </td>

      </tr>

    `;

  });


  /* 행 탭 강조 */

  const rows =
    dayBody.querySelectorAll("tr");


  rows.forEach(tr=>{

    tr.addEventListener(
      "click",
      ()=>{

        if(
          tr.classList.contains(
            "row-selected"
          )
        ){

          tr.classList.remove(
            "row-selected"
          );

          return;
        }


        const selected =
          dayBody.querySelectorAll(
            "tr.row-selected"
          );


        if(
          selected.length >= 10
        )
          return;


        tr.classList.add(
          "row-selected"
        );

      }
    );

  });

}


/* =========================
   오늘 날짜
========================= */

function goToday(){

  let d =
    new Date();


  d =
    new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    );


  let guard = 0;


  while(
    !isWork(d) &&
    guard < 31
  ){

    d.setDate(
      d.getDate()+1
    );

    guard++;

  }


  if(d < START)
    d = new Date(START);


  document.getElementById(
    "dayDate"
  ).value =
    isoLocal(d);


  updateDowLabel();

  populateMyNameSelect();

  renderDay();
}

function showToast(
  title,
  desc,
  duration = 2300
){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.innerHTML = `

    <div class="toast-icon">
      ✓
    </div>

    <div class="toast-title">
      ${title}
    </div>

    <div class="toast-desc">
      ${desc}
    </div>

  `;


  toast.classList.remove(
    "hide"
  );

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toast._timer
  );


  toast._timer =
    setTimeout(
      ()=>{

        toast.classList.remove(
          "show"
        );

        toast.classList.add(
          "hide"
        );

      },
      duration
    );

}

/* =========================
   좌우 스와이프
========================= */

let touchStartX = 0;

let touchEndX = 0;

const SWIPE_THRESHOLD = 90;


/* 다음/이전 근무일 */

function moveWorkDay(delta){

  let d =
    parseDate(
      document.getElementById(
        "dayDate"
      ).value
    );


  if(!d)
    return;


  let guard = 0;


  do{

    d.setDate(
      d.getDate()+delta
    );

    guard++;

  }while(
    !isWork(d) &&
    guard < 31
  );


  document.getElementById(
    "dayDate"
  ).value =
    isoLocal(d);


  updateDowLabel();


  const row =
    document.querySelector(
      ".date-row"
    );


  if(row){

    row.classList.remove(
      "date-flash"
    );

    void row.offsetWidth;

    row.classList.add(
      "date-flash"
    );

  }


  renderDay();

}


/* 터치 시작 */

document.addEventListener(
  "touchstart",
  (e)=>{

    if(
      e.touches.length !== 1
    )
      return;

    touchStartX =
      e.touches[0].clientX;

  },
  {
    passive:true
  }
);


/* 터치 종료 */

document.addEventListener(
  "touchend",
  (e)=>{

    touchEndX =
      e.changedTouches[0].clientX;

    handleSwipe();

  },
  {
    passive:true
  }
);


function handleSwipe(){

  const diff =
    touchEndX -
    touchStartX;


  if(
    Math.abs(diff) <
    SWIPE_THRESHOLD
  )
    return;


  if(diff < 0){

    moveWorkDay(+1);

  }else{

    moveWorkDay(-1);

  }

}
